name: probe-arm64-redroid

# 仅用于手动验证 GitHub Hosted ARM64 Linux runner 能否承载后续 redroid PoC。
# 不下载 Android/redroid 镜像、不安装领克 APK、不读取或写入任何 Secret。
on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: ARM64 redroid prerequisites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Report runner architecture and resources
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ARM64 Hosted Runner preflight"
            echo
            echo "- Runner: \`${{ runner.os }} / ${{ runner.arch }}\`"
            echo "- This probe does not download Android images, install APKs, or access secrets."
            echo
            echo "### Host identity"
            echo '```text'
            uname -a
            dpkg --print-architecture
            getconf PAGESIZE
            cat /etc/os-release
            echo
            echo "=== Disk ==="
            df -h /
            echo
            echo "=== Memory ==="
            free -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect Docker and Android kernel prerequisites
        id: host
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/redroid-host-prerequisites.txt"

          check() {
            local label="$1"
            shift
            if "$@"; then
              printf 'PASS: %s\n' "$label" | tee -a "$report"
            else
              printf 'FAIL: %s\n' "$label" | tee -a "$report"
            fi
          }

          : > "$report"
          check "host architecture is aarch64/arm64" bash -c 'case "$(uname -m)" in aarch64|arm64) exit 0;; *) exit 1;; esac'
          check "Docker CLI is installed" command -v docker
          check "Docker daemon is reachable" docker info
          check "binder filesystem is registered" grep -qw binder /proc/filesystems
          check "binder device exists" bash -c 'compgen -G "/dev/binder*" > /dev/null'
          check "binderfs mount point exists" test -d /dev/binderfs
          check "DMA-BUF heap device exists" bash -c 'compgen -G "/dev/dma_heap/*" > /dev/null'
          check "IPv6 is enabled" bash -c 'test "$(cat /proc/sys/net/ipv6/conf/all/disable_ipv6)" = 0'

          {
            echo "## Host prerequisite results"
            echo
            echo '```text'
            cat "$report"
            echo
            echo "=== Binder-related filesystems ==="
            grep -E 'binder|ashmem' /proc/filesystems || true
            echo
            echo "=== Binder-related modules ==="
            grep -E 'binder|ashmem' /proc/modules || true
            echo
            echo "=== Relevant device nodes ==="
            ls -la /dev/binder* /dev/binderfs /dev/dma_heap 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe privileged container and BinderFS mount
        id: privileged
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/redroid-privileged-binderfs.txt"

          docker run --rm --privileged alpine:3.20 sh -ceu '
            case "$(uname -m)" in
              aarch64|arm64) ;;
              *) echo "unexpected container architecture: $(uname -m)" >&2; exit 20 ;;
            esac
            mkdir -p /tmp/binderfs
            mount -t binder binder /tmp/binderfs
            test -d /tmp/binderfs
            ls -la /tmp/binderfs
            umount /tmp/binderfs
          ' > "$log" 2>&1
          status=$?

          {
            echo "## Privileged-container BinderFS probe"
            echo
            echo "- Exit code: \`$status\`"
            echo "- A non-zero result means this Hosted Runner cannot be used as a redroid host without a different kernel/runtime capability."
            echo
            echo '```text'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "BinderFS mount probe failed (exit=$status); recorded as diagnostic evidence."
          else
            echo "BinderFS mount probe passed."
          fi

      - name: State the decision boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Next decision"
            echo
            echo "Proceed to a redroid runtime PoC only when all host checks pass and the privileged-container BinderFS mount probe exits with 0."
            echo "This workflow intentionally does not test the existing Android Emulator path: the project's extractor rejects Linux ARM64 because Google does not provide the required Linux ARM64 Emulator/platform-tools combination."
          } >> "$GITHUB_STEP_SUMMARY"
