name: extract-appsecret

# 手动触发。在 GitHub 托管 ubuntu-latest（x86_64，自带 /dev/kvm）上
# 从零完成提取，全程无人值守：自动下载 emulator + x86_64 API33 系统镜像
# （google_apis）+ 最新 APK -> 无头冷启动（KVM 加速，约 2~5 分钟）
# -> 断点提取 -> 写 env.json。
# 为何默认 x86_64 镜像（2026-09-06 实测，详见 docs/本地一键提取指南.md
# 第 2 节）：arm64 镜像路线不可救——arm64 ranchu 虚拟机没有 PCI 总线，
# 而 31.3.10/36.2.12 的 qemu fork 会无条件初始化 virtio-snd-pci，
# "PCI bus not available" 直接致命且无参数可绕。x86_64 镜像下加固壳的
# arm64 原生库经 libndk 翻译执行，可存活到 <clinit>，本地（WSL2+KVM）
# 已实测跑通。保留 arm64-v8a 选项仅供排障对照（预期仍在 virtio-snd
# 处失败）。
# 另配置 LYNKCO_PAT Secret（需具备本仓库 Secret 写权限）时，提取结果会
# 自动合并更新仓库 Secret LYNKCO_APP_SECRETS，免去手动复制。
on:
  workflow_dispatch:
    inputs:
      image-abi:
        description: "系统镜像 ABI：x86_64=KVM 加速（默认/推荐）；arm64-v8a=已证实不可行，仅排障对照"
        type: choice
        default: x86_64
        options:
          - arm64-v8a
          - x86_64

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 开放 KVM 权限（模拟器加速用）
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::runner 无 /dev/kvm，将退化为纯软件模拟（x86_64 镜像下仍可运行，只是慢）"
          fi

      - name: 提取 AppSecret（x86_64 镜像 + KVM -> 冷启动 -> 断点提取）
        env:
          EMU_HEADLESS: "1"        # 无头模式（无 DISPLAY 时脚本也会自动切换）
          LYNKCO_AUTO_WRITE: "1"   # 免交互确认，自动写入 env.json
          LYNKCO_IMAGE_ABI: ${{ inputs.image-abi || 'x86_64' }}
        run: python3 LynkCoHelper/tools/extract_appsecret_github_action.py

      # 模拟器排障三件套：宿主磁盘/内存/内核日志（OOM killer 发 SIGKILL
      # 只能从 dmesg 看到；磁盘爆盘 qemu 初始化即死且报错晦涩）
      - name: 失败诊断（磁盘/内存/内核日志）
        if: failure()
        run: |
          echo "=== df -h ==="; df -h || true
          echo "=== free -h ==="; free -h || true
          echo "=== dmesg 末尾（看 OOM killer）==="; sudo dmesg 2>/dev/null | tail -40 || true

      - name: 上传模拟器完整日志（失败诊断）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: /home/runner/.lynkco-helper-tools/emulator.log
          if-no-files-found: ignore

      - name: 同步更新仓库 Secret LYNKCO_APP_SECRETS
        env:
          GH_TOKEN: ${{ secrets.LYNKCO_PAT }}             # 未配置则跳过
          MERGED_FROM: ${{ secrets.LYNKCO_APP_SECRETS }}  # 现有值，保留未变更字段
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          if not os.environ.get("GH_TOKEN"):
              print("[*] 未配置 LYNKCO_PAT，跳过自动同步")
              raise SystemExit(0)
          merged = {}
          try:
              merged.update(json.loads(os.environ.get("MERGED_FROM", "")))
          except Exception:
              pass  # 现有值缺失/格式异常时，以本次提取结果为准
          # 读取上一步脚本写入的 env.json（CI 内的临时数据通道，runner 销毁即丢弃）
          with open("LynkCoHelper/env.json", encoding="utf-8") as f:
              merged.update(json.load(f).get("secrets", {}))
          subprocess.run(["gh", "secret", "set", "LYNKCO_APP_SECRETS",
                          "--repo", os.environ["GITHUB_REPOSITORY"],
                          "--body", json.dumps(merged, ensure_ascii=False)],
                         check=True)
          print(f"[+] LYNKCO_APP_SECRETS 已更新（{len(merged)} 个字段）")
          EOF
